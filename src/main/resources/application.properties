# ========================================================
# BloodConnect Active Application Configuration
# ========================================================

app.name=BloodConnect
app.version=1.0.0
app.context=/BloodConnect
app.port=8080

# Database Configuration (MySQL / MariaDB)
db.driver=com.mysql.cj.jdbc.Driver
db.url=jdbc:mysql://localhost:3306/bloodconnect_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
db.user=root
db.password=root

# Connection Pool Settings
db.pool.initialSize=5
db.pool.maxTotal=20

# Zero-Config Fallback (Set to true so that if MySQL server is not running,
# it auto-initializes the in-memory/embedded H2 schema with seed data seamlessly)
db.fallback.h2=true
